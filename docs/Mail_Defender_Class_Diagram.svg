<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .bg { fill: #f7faff; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0b2545; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #5b677a; }
      .class { fill: #ffffff; stroke: #0b2545; stroke-width: 2; rx: 10; }
      .class-service { fill: #f8fbff; stroke: #1f5a91; stroke-width: 2; rx: 10; }
      .class-future { fill: #fff7e6; stroke: #b7791f; stroke-width: 2; stroke-dasharray: 8 5; rx: 10; }
      .head { fill: #eaf2fb; stroke: #0b2545; stroke-width: 1.6; }
      .head-service { fill: #dcecff; stroke: #1f5a91; stroke-width: 1.6; }
      .head-future { fill: #fff1d6; stroke: #b7791f; stroke-width: 1.6; }
      .name { font: 700 17px Arial, Helvetica, sans-serif; fill: #0b2545; text-anchor: middle; }
      .stereo { font: 400 12px Arial, Helvetica, sans-serif; fill: #5b677a; text-anchor: middle; }
      .text { font: 400 13px Consolas, "Courier New", monospace; fill: #172033; }
      .method { font: 400 13px Consolas, "Courier New", monospace; fill: #1f3a5f; }
      .section-line { stroke: #c9d4e2; stroke-width: 1; }
      .assoc { stroke: #53657a; stroke-width: 1.6; stroke-opacity: 0.68; fill: none; }
      .dependency { stroke: #1f5a91; stroke-width: 1.45; stroke-opacity: 0.68; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .inherit { stroke: #1f5a91; stroke-width: 1.6; stroke-opacity: 0.75; fill: none; marker-end: url(#triangle); }
      .label { font: 700 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .multi { font: 700 12px Arial, Helvetica, sans-serif; fill: #0b2545; }
      .note { fill: #ffffff; stroke: #c9d4e2; stroke-width: 1.4; rx: 12; }
      .note-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .note-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #0b2545; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#1f5a91"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#1f5a91" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1250"/>
  <text class="title" x="900" y="54" text-anchor="middle">Mail Defender - UML Class Diagram</text>
  <text class="subtitle" x="900" y="83" text-anchor="middle">Core domain model for suspicious email analysis, enrichment, scoring, AI summary, reporting, and future case management</text>

  <!-- Organization -->
  <g id="Organization" transform="translate(55 135)">
    <rect class="class" x="0" y="0" width="245" height="176"/>
    <rect class="head" x="0" y="0" width="245" height="45"/>
    <text class="name" x="122.5" y="28">Organization</text>
    <line class="section-line" x1="0" y1="108" x2="245" y2="108"/>
    <text class="text" x="14" y="68">+ organizationId: UUID</text>
    <text class="text" x="14" y="88">+ name: String</text>
    <text class="text" x="14" y="128">+ addUser(user)</text>
    <text class="method" x="14" y="148">+ configureIntegration()</text>
  </g>

  <!-- User -->
  <g id="User" transform="translate(355 135)">
    <rect class="class" x="0" y="0" width="245" height="176"/>
    <rect class="head" x="0" y="0" width="245" height="45"/>
    <text class="name" x="122.5" y="28">User</text>
    <line class="section-line" x1="0" y1="108" x2="245" y2="108"/>
    <text class="text" x="14" y="68">+ userId: UUID</text>
    <text class="text" x="14" y="88">+ name: String</text>
    <text class="text" x="14" y="128">+ submitEmail()</text>
    <text class="method" x="14" y="148">+ exportReport()</text>
  </g>

  <!-- Role -->
  <g id="Role" transform="translate(655 135)">
    <rect class="class" x="0" y="0" width="220" height="176"/>
    <rect class="head" x="0" y="0" width="220" height="45"/>
    <text class="name" x="110" y="28">Role</text>
    <line class="section-line" x1="0" y1="108" x2="220" y2="108"/>
    <text class="text" x="14" y="68">+ roleId: UUID</text>
    <text class="text" x="14" y="88">+ name: String</text>
    <text class="text" x="14" y="128">+ canAnalyze: Boolean</text>
    <text class="method" x="14" y="148">+ canAdmin: Boolean</text>
  </g>

  <!-- EmailSubmission -->
  <g id="EmailSubmission" transform="translate(930 135)">
    <rect class="class" x="0" y="0" width="285" height="210"/>
    <rect class="head" x="0" y="0" width="285" height="45"/>
    <text class="name" x="142.5" y="28">EmailSubmission</text>
    <line class="section-line" x1="0" y1="128" x2="285" y2="128"/>
    <text class="text" x="14" y="66">+ submissionId: UUID</text>
    <text class="text" x="14" y="86">+ emailHeaders: String</text>
    <text class="text" x="14" y="106">+ emailBody: String</text>
    <text class="text" x="14" y="148">+ splitRawEmail()</text>
    <text class="method" x="14" y="168">+ validateInput()</text>
    <text class="method" x="14" y="188">+ getRawMessage()</text>
  </g>

  <!-- Case -->
  <g id="InvestigationCase" transform="translate(1270 135)">
    <rect class="class-future" x="0" y="0" width="300" height="210"/>
    <rect class="head-future" x="0" y="0" width="300" height="45"/>
    <text class="name" x="150" y="23">InvestigationCase</text>
    <text class="stereo" x="150" y="39">future company-level feature</text>
    <line class="section-line" x1="0" y1="128" x2="300" y2="128"/>
    <text class="text" x="14" y="66">+ caseId: UUID</text>
    <text class="text" x="14" y="86">+ severity: Severity</text>
    <text class="text" x="14" y="106">+ status: CaseStatus</text>
    <text class="text" x="14" y="148">+ assignOwner(user)</text>
    <text class="method" x="14" y="168">+ addComment(text)</text>
    <text class="method" x="14" y="188">+ closeCase()</text>
  </g>

  <!-- HeaderDetails -->
  <g id="HeaderDetails" transform="translate(55 410)">
    <rect class="class" x="0" y="0" width="285" height="196"/>
    <rect class="head" x="0" y="0" width="285" height="45"/>
    <text class="name" x="142.5" y="28">HeaderDetails</text>
    <line class="section-line" x1="0" y1="128" x2="285" y2="128"/>
    <text class="text" x="14" y="66">+ from: String</text>
    <text class="text" x="14" y="86">+ replyTo: String</text>
    <text class="text" x="14" y="106">+ originatingIp: String</text>
    <text class="text" x="14" y="148">+ getSenderDomain()</text>
    <text class="method" x="14" y="168">+ hasReplyMismatch()</text>
  </g>

  <!-- AuthCheck -->
  <g id="AuthCheck" transform="translate(395 410)">
    <rect class="class" x="0" y="0" width="260" height="196"/>
    <rect class="head" x="0" y="0" width="260" height="45"/>
    <text class="name" x="130" y="28">AuthCheck</text>
    <line class="section-line" x1="0" y1="128" x2="260" y2="128"/>
    <text class="text" x="14" y="66">+ spf: AuthStatus</text>
    <text class="text" x="14" y="86">+ dkim: AuthStatus</text>
    <text class="text" x="14" y="106">+ dmarc: AuthStatus</text>
    <text class="text" x="14" y="148">+ getTone()</text>
    <text class="method" x="14" y="168">+ isFailure()</text>
  </g>

  <!-- Indicator -->
  <g id="Indicator" transform="translate(710 410)">
    <rect class="class" x="0" y="0" width="260" height="196"/>
    <rect class="head" x="0" y="0" width="260" height="45"/>
    <text class="name" x="130" y="28">Indicator</text>
    <line class="section-line" x1="0" y1="128" x2="260" y2="128"/>
    <text class="text" x="14" y="66">+ indicatorId: UUID</text>
    <text class="text" x="14" y="86">+ type: IOCType</text>
    <text class="text" x="14" y="106">+ value: String</text>
    <text class="text" x="14" y="148">+ normalize()</text>
    <text class="method" x="14" y="168">+ getDisposition()</text>
  </g>

  <!-- Attachment -->
  <g id="Attachment" transform="translate(1025 410)">
    <rect class="class" x="0" y="0" width="270" height="196"/>
    <rect class="head" x="0" y="0" width="270" height="45"/>
    <text class="name" x="135" y="28">Attachment</text>
    <line class="section-line" x1="0" y1="128" x2="270" y2="128"/>
    <text class="text" x="14" y="66">+ filename: String</text>
    <text class="text" x="14" y="86">+ contentType: String</text>
    <text class="text" x="14" y="106">+ sha256: String</text>
    <text class="text" x="14" y="148">+ calculateHash()</text>
    <text class="method" x="14" y="168">+ toIndicator()</text>
  </g>

  <!-- Report -->
  <g id="Report" transform="translate(1350 410)">
    <rect class="class" x="0" y="0" width="270" height="196"/>
    <rect class="head" x="0" y="0" width="270" height="45"/>
    <text class="name" x="135" y="28">Report</text>
    <line class="section-line" x1="0" y1="128" x2="270" y2="128"/>
    <text class="text" x="14" y="66">+ reportId: UUID</text>
    <text class="text" x="14" y="86">+ generatedAt: DateTime</text>
    <text class="text" x="14" y="106">+ format: PDF/Text</text>
    <text class="text" x="14" y="148">+ copyToClipboard()</text>
    <text class="method" x="14" y="168">+ exportPdf()</text>
  </g>

  <!-- Services row -->
  <g id="EmailParser" transform="translate(55 690)">
    <rect class="class-service" x="0" y="0" width="260" height="176"/>
    <rect class="head-service" x="0" y="0" width="260" height="45"/>
    <text class="stereo" x="130" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="130" y="35">EmailParser</text>
    <line class="section-line" x1="0" y1="100" x2="260" y2="100"/>
    <text class="text" x="14" y="66">+ maxSize: Number</text>
    <text class="text" x="14" y="120">+ parse(rawEmail)</text>
    <text class="method" x="14" y="140">+ extractAttachments()</text>
  </g>

  <g id="IOCExtractor" transform="translate(365 690)">
    <rect class="class-service" x="0" y="0" width="260" height="176"/>
    <rect class="head-service" x="0" y="0" width="260" height="45"/>
    <text class="stereo" x="130" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="130" y="35">IOCExtractor</text>
    <line class="section-line" x1="0" y1="100" x2="260" y2="100"/>
    <text class="text" x="14" y="66">+ regexRules: Pattern[]</text>
    <text class="text" x="14" y="120">+ extract(text)</text>
    <text class="method" x="14" y="140">+ filterPrivateIps()</text>
  </g>

  <g id="ThreatIntelService" transform="translate(675 690)">
    <rect class="class-service" x="0" y="0" width="290" height="176"/>
    <rect class="head-service" x="0" y="0" width="290" height="45"/>
    <text class="stereo" x="145" y="17">&lt;&lt;abstract service&gt;&gt;</text>
    <text class="name" x="145" y="35">ThreatIntelService</text>
    <line class="section-line" x1="0" y1="100" x2="290" y2="100"/>
    <text class="text" x="14" y="66">+ apiKey: Secret</text>
    <text class="text" x="14" y="120">+ lookup(indicator)</text>
    <text class="method" x="14" y="140">+ mapDisposition()</text>
  </g>

  <g id="VirusTotalService" transform="translate(1015 690)">
    <rect class="class-service" x="0" y="0" width="275" height="176"/>
    <rect class="head-service" x="0" y="0" width="275" height="45"/>
    <text class="stereo" x="137.5" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="137.5" y="35">VirusTotalService</text>
    <line class="section-line" x1="0" y1="100" x2="275" y2="100"/>
    <text class="text" x="14" y="66">+ endpoint: URL</text>
    <text class="text" x="14" y="120">+ lookupUrl()</text>
    <text class="method" x="14" y="140">+ lookupHash()</text>
  </g>

  <g id="AbuseIPDBService" transform="translate(1340 690)">
    <rect class="class-service" x="0" y="0" width="275" height="176"/>
    <rect class="head-service" x="0" y="0" width="275" height="45"/>
    <text class="stereo" x="137.5" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="137.5" y="35">AbuseIPDBService</text>
    <line class="section-line" x1="0" y1="100" x2="275" y2="100"/>
    <text class="text" x="14" y="66">+ maxAgeInDays: Number</text>
    <text class="text" x="14" y="120">+ checkIp(ip)</text>
    <text class="method" x="14" y="140">+ getAbuseScore()</text>
  </g>

  <!-- Bottom row -->
  <g id="RiskScoringEngine" transform="translate(220 955)">
    <rect class="class-service" x="0" y="0" width="290" height="176"/>
    <rect class="head-service" x="0" y="0" width="290" height="45"/>
    <text class="stereo" x="145" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="145" y="35">RiskScoringEngine</text>
    <line class="section-line" x1="0" y1="100" x2="290" y2="100"/>
    <text class="text" x="14" y="66">+ rules: Rule[]</text>
    <text class="text" x="14" y="120">+ calculateScore()</text>
    <text class="method" x="14" y="140">+ classifyAttackType()</text>
  </g>

  <g id="AnalysisResult" transform="translate(570 940)">
    <rect class="class" x="0" y="0" width="300" height="210"/>
    <rect class="head" x="0" y="0" width="300" height="45"/>
    <text class="name" x="150" y="28">AnalysisResult</text>
    <line class="section-line" x1="0" y1="128" x2="300" y2="128"/>
    <text class="text" x="14" y="66">+ resultId: UUID</text>
    <text class="text" x="14" y="86">+ verdict: Verdict</text>
    <text class="text" x="14" y="106">+ score: Number</text>
    <text class="text" x="14" y="148">+ mergeAiFindings()</text>
    <text class="method" x="14" y="168">+ buildSummary()</text>
    <text class="method" x="14" y="188">+ getRecommendations()</text>
  </g>

  <g id="AIAnalysisService" transform="translate(930 955)">
    <rect class="class-service" x="0" y="0" width="290" height="176"/>
    <rect class="head-service" x="0" y="0" width="290" height="45"/>
    <text class="stereo" x="145" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="145" y="35">AIAnalysisService</text>
    <line class="section-line" x1="0" y1="100" x2="290" y2="100"/>
    <text class="text" x="14" y="66">+ model: String</text>
    <text class="text" x="14" y="120">+ buildPrompt()</text>
    <text class="method" x="14" y="140">+ summarizeEvidence()</text>
  </g>

  <g id="ReportGenerator" transform="translate(1280 955)">
    <rect class="class-service" x="0" y="0" width="290" height="176"/>
    <rect class="head-service" x="0" y="0" width="290" height="45"/>
    <text class="stereo" x="145" y="17">&lt;&lt;service&gt;&gt;</text>
    <text class="name" x="145" y="35">ReportGenerator</text>
    <line class="section-line" x1="0" y1="100" x2="290" y2="100"/>
    <text class="text" x="14" y="66">+ template: ReportTemplate</text>
    <text class="text" x="14" y="120">+ buildStructuredReport()</text>
    <text class="method" x="14" y="140">+ exportPdf()</text>
  </g>

  <!-- Associations -->
  <path class="assoc" d="M300 223 L355 223"/>
  <text class="multi" x="310" y="213">1</text>
  <text class="multi" x="335" y="213">*</text>
  <text class="label" x="314" y="246">has users</text>

  <path class="assoc" d="M600 223 L655 223"/>
  <text class="multi" x="612" y="213">*</text>
  <text class="multi" x="638" y="213">1</text>
  <text class="label" x="608" y="246">assigned role</text>

  <path class="assoc" d="M600 280 L930 240"/>
  <text class="multi" x="618" y="292">1</text>
  <text class="multi" x="905" y="232">*</text>
  <text class="label" x="715" y="248">submits</text>

  <path class="assoc" d="M1215 235 L1270 235"/>
  <text class="multi" x="1224" y="225">1</text>
  <text class="multi" x="1252" y="225">0..1</text>
  <text class="label" x="1212" y="260">may become case</text>

  <path class="assoc" d="M1072 345 L1072 940 L870 1045"/>
  <text class="multi" x="1085" y="365">1</text>
  <text class="multi" x="887" y="1038">1</text>
  <text class="label" x="1078" y="620">produces</text>

  <path class="assoc" d="M930 310 L340 445"/>
  <text class="multi" x="908" y="326">1</text>
  <text class="multi" x="350" y="437">1</text>
  <text class="label" x="595" y="356">contains header details</text>

  <path class="assoc" d="M1000 345 L655 470"/>
  <text class="multi" x="1010" y="363">1</text>
  <text class="multi" x="662" y="461">*</text>
  <text class="label" x="810" y="397">has auth checks</text>

  <path class="assoc" d="M1095 345 L970 410"/>
  <text class="multi" x="1098" y="365">1</text>
  <text class="multi" x="980" y="400">*</text>
  <text class="label" x="1035" y="384">extracts</text>

  <path class="assoc" d="M1155 345 L1155 410"/>
  <text class="multi" x="1167" y="368">1</text>
  <text class="multi" x="1167" y="403">*</text>
  <text class="label" x="1170" y="388">has files</text>

  <path class="assoc" d="M870 1045 L1350 508"/>
  <text class="multi" x="890" y="1035">1</text>
  <text class="multi" x="1328" y="522">1</text>
  <text class="label" x="1105" y="795">creates report</text>

  <!-- Dependencies from services -->
  <path class="dependency" d="M185 690 L155 606"/>
  <path class="dependency" d="M315 745 L930 260"/>
  <path class="dependency" d="M495 690 L840 606"/>
  <path class="dependency" d="M965 770 L1015 770"/>
  <path class="dependency" d="M965 805 L1340 805"/>
  <path class="inherit" d="M1150 690 L965 742"/>
  <path class="inherit" d="M1440 690 L965 790"/>
  <path class="dependency" d="M510 1040 L570 1040"/>
  <path class="dependency" d="M930 1040 L870 1040"/>
  <path class="dependency" d="M1280 1040 L870 1040"/>
  <path class="dependency" d="M365 955 L525 606"/>
  <path class="dependency" d="M365 955 L840 606"/>

  <!-- Legend -->
  <rect class="note" x="55" y="1165" width="1490" height="55"/>
  <text class="note-title" x="75" y="1188">Legend:</text>
  <text class="note-text" x="130" y="1188">Solid lines show domain associations and multiplicity. Dashed blue arrows show service dependencies. Hollow triangle arrows show service inheritance.</text>
  <text class="note-text" x="75" y="1209">Gold dashed classes represent future company-level upgrades such as case management and administration.</text>
</svg>
