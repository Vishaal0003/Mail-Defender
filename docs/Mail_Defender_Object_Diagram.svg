<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120">
  <defs>
    <style>
      .bg { fill: #f7faff; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0b2545; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #5b677a; }
      .object { fill: #ffffff; stroke: #0b2545; stroke-width: 2; rx: 10; }
      .object-evidence { fill: #f8fbff; stroke: #1f5a91; stroke-width: 2; rx: 10; }
      .object-alert { fill: #fff7e6; stroke: #b7791f; stroke-width: 2; rx: 10; }
      .object-future { fill: #fff7e6; stroke: #b7791f; stroke-width: 2; stroke-dasharray: 8 5; rx: 10; }
      .head { fill: #eaf2fb; stroke: #0b2545; stroke-width: 1.5; }
      .head-alert { fill: #fff1d6; stroke: #b7791f; stroke-width: 1.5; }
      .name { font: 700 16px Arial, Helvetica, sans-serif; fill: #0b2545; text-anchor: middle; text-decoration: underline; }
      .text { font: 400 13px Consolas, "Courier New", monospace; fill: #172033; }
      .section-line { stroke: #c9d4e2; stroke-width: 1; }
      .link { stroke: #53657a; stroke-width: 1.8; fill: none; }
      .dependency { stroke: #1f5a91; stroke-width: 1.7; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .label { font: 700 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .note { fill: #ffffff; stroke: #c9d4e2; stroke-width: 1.4; rx: 12; }
      .note-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .note-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #0b2545; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#1f5a91"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1120"/>
  <text class="title" x="850" y="54" text-anchor="middle">Mail Defender - UML Object Diagram</text>
  <text class="subtitle" x="850" y="83" text-anchor="middle">Runtime snapshot of one high-risk credential phishing investigation</text>

  <!-- Links are intentionally drawn before object boxes so connectors never cover object text. -->
  <path class="link" d="M330 210 L430 210"/>
  <path class="link" d="M790 210 L910 210"/>
  <path class="link" d="M1240 210 L1370 210"/>

  <path class="link" d="M515 300 L250 385"/>
  <path class="link" d="M590 300 L590 385"/>
  <path class="link" d="M695 300 L930 385"/>
  <path class="link" d="M735 300 L1330 385"/>
  <path class="link" d="M545 300 L295 665"/>

  <path class="dependency" d="M965 565 L705 665"/>
  <path class="dependency" d="M1375 565 L1110 665"/>
  <path class="dependency" d="M1075 300 L1465 665"/>
  <path class="link" d="M1075 300 L910 900"/>

  <!-- Relationship labels -->
  <text class="label" x="362" y="198">submits</text>
  <text class="label" x="824" y="198">produces</text>
  <text class="label" x="1282" y="198">exports</text>
  <text class="label" x="330" y="350">has</text>
  <text class="label" x="605" y="350">has</text>
  <text class="label" x="812" y="350">extracts</text>
  <text class="label" x="1048" y="350">extracts</text>
  <text class="label" x="390" y="550">contains</text>
  <text class="label" x="790" y="640">enriched by</text>
  <text class="label" x="1190" y="640">enriched by</text>
  <text class="label" x="1280" y="548">summarized by</text>
  <text class="label" x="945" y="885">may open future case</text>

  <!-- Row 1 -->
  <g id="user1" transform="translate(60 135)">
    <rect class="object" x="0" y="0" width="270" height="150"/>
    <rect class="head" x="0" y="0" width="270" height="42"/>
    <text class="name" x="135" y="27">analyst1 : User</text>
    <line class="section-line" x1="0" y1="42" x2="270" y2="42"/>
    <text class="text" x="14" y="70">name = "Security Analyst"</text>
    <text class="text" x="14" y="92">role = "Analyst"</text>
    <text class="text" x="14" y="114">canAnalyze = true</text>
  </g>

  <g id="submission1" transform="translate(430 120)">
    <rect class="object-alert" x="0" y="0" width="360" height="180"/>
    <rect class="head-alert" x="0" y="0" width="360" height="42"/>
    <text class="name" x="180" y="27">submission1 : EmailSubmission</text>
    <line class="section-line" x1="0" y1="42" x2="360" y2="42"/>
    <text class="text" x="14" y="70">source = ".eml upload"</text>
    <text class="text" x="14" y="92">subject = "Verify Your Account Now"</text>
    <text class="text" x="14" y="114">from = "support@fake-bank-secure.com"</text>
    <text class="text" x="14" y="136">bodyContains = "login / verify"</text>
  </g>

  <g id="result1" transform="translate(910 120)">
    <rect class="object-alert" x="0" y="0" width="330" height="180"/>
    <rect class="head-alert" x="0" y="0" width="330" height="42"/>
    <text class="name" x="165" y="27">analysis1 : AnalysisResult</text>
    <line class="section-line" x1="0" y1="42" x2="330" y2="42"/>
    <text class="text" x="14" y="70">verdict = "High Risk"</text>
    <text class="text" x="14" y="92">score = 82</text>
    <text class="text" x="14" y="114">attackType = "Credential Harvesting"</text>
    <text class="text" x="14" y="136">riskFactors = ["DMARC fail", "URL"]</text>
  </g>

  <g id="report1" transform="translate(1370 135)">
    <rect class="object" x="0" y="0" width="270" height="150"/>
    <rect class="head" x="0" y="0" width="270" height="42"/>
    <text class="name" x="135" y="27">report1 : Report</text>
    <line class="section-line" x1="0" y1="42" x2="270" y2="42"/>
    <text class="text" x="14" y="70">format = "PDF"</text>
    <text class="text" x="14" y="92">status = "Generated"</text>
    <text class="text" x="14" y="114">title = "Security Analysis"</text>
  </g>

  <!-- Row 2 evidence -->
  <g id="header1" transform="translate(60 385)">
    <rect class="object-evidence" x="0" y="0" width="330" height="170"/>
    <rect class="head" x="0" y="0" width="330" height="42"/>
    <text class="name" x="165" y="27">header1 : HeaderDetails</text>
    <line class="section-line" x1="0" y1="42" x2="330" y2="42"/>
    <text class="text" x="14" y="70">fromDomain = "fake-bank-secure.com"</text>
    <text class="text" x="14" y="92">replyTo = "helpdesk@random-mail.xyz"</text>
    <text class="text" x="14" y="114">originatingIp = "185.199.110.153"</text>
    <text class="text" x="14" y="136">replyMismatch = true</text>
  </g>

  <g id="auth1" transform="translate(455 385)">
    <rect class="object-alert" x="0" y="0" width="270" height="170"/>
    <rect class="head-alert" x="0" y="0" width="270" height="42"/>
    <text class="name" x="135" y="27">auth1 : AuthCheck</text>
    <line class="section-line" x1="0" y1="42" x2="270" y2="42"/>
    <text class="text" x="14" y="70">spf = "fail"</text>
    <text class="text" x="14" y="92">dkim = "unknown"</text>
    <text class="text" x="14" y="114">dmarc = "fail"</text>
    <text class="text" x="14" y="136">tone = "danger"</text>
  </g>

  <g id="url1" transform="translate(800 385)">
    <rect class="object-alert" x="0" y="0" width="350" height="180"/>
    <rect class="head-alert" x="0" y="0" width="350" height="42"/>
    <text class="name" x="175" y="27">url1 : Indicator</text>
    <line class="section-line" x1="0" y1="42" x2="350" y2="42"/>
    <text class="text" x="14" y="70">type = "URL"</text>
    <text class="text" x="14" y="92">value = "https://secure-login.xyz/verify"</text>
    <text class="text" x="14" y="114">domain = "secure-login.xyz"</text>
    <text class="text" x="14" y="136">disposition = "Suspicious"</text>
  </g>

  <g id="ip1" transform="translate(1230 385)">
    <rect class="object-evidence" x="0" y="0" width="330" height="180"/>
    <rect class="head" x="0" y="0" width="330" height="42"/>
    <text class="name" x="165" y="27">ip1 : Indicator</text>
    <line class="section-line" x1="0" y1="42" x2="330" y2="42"/>
    <text class="text" x="14" y="70">type = "IP"</text>
    <text class="text" x="14" y="92">value = "185.199.110.153"</text>
    <text class="text" x="14" y="114">abuseScore = 35</text>
    <text class="text" x="14" y="136">disposition = "Suspicious"</text>
  </g>

  <!-- Row 3 -->
  <g id="attachment1" transform="translate(130 665)">
    <rect class="object-evidence" x="0" y="0" width="330" height="170"/>
    <rect class="head" x="0" y="0" width="330" height="42"/>
    <text class="name" x="165" y="27">attachment1 : Attachment</text>
    <line class="section-line" x1="0" y1="42" x2="330" y2="42"/>
    <text class="text" x="14" y="70">filename = "invoice.pdf"</text>
    <text class="text" x="14" y="92">contentType = "application/pdf"</text>
    <text class="text" x="14" y="114">sha256 = "a7f3...9c2d"</text>
    <text class="text" x="14" y="136">size = "188 KB"</text>
  </g>

  <g id="vt1" transform="translate(550 665)">
    <rect class="object-evidence" x="0" y="0" width="310" height="170"/>
    <rect class="head" x="0" y="0" width="310" height="42"/>
    <text class="name" x="155" y="27">vt1 : VirusTotalReport</text>
    <line class="section-line" x1="0" y1="42" x2="310" y2="42"/>
    <text class="text" x="14" y="70">indicator = url1</text>
    <text class="text" x="14" y="92">malicious = 2</text>
    <text class="text" x="14" y="114">suspicious = 4</text>
    <text class="text" x="14" y="136">disposition = "Suspicious"</text>
  </g>

  <g id="abuse1" transform="translate(950 665)">
    <rect class="object-evidence" x="0" y="0" width="310" height="170"/>
    <rect class="head" x="0" y="0" width="310" height="42"/>
    <text class="name" x="155" y="27">abuse1 : AbuseIPDBReport</text>
    <line class="section-line" x1="0" y1="42" x2="310" y2="42"/>
    <text class="text" x="14" y="70">ipAddress = ip1</text>
    <text class="text" x="14" y="92">countryCode = "US"</text>
    <text class="text" x="14" y="114">confidence = 35</text>
    <text class="text" x="14" y="136">disposition = "Suspicious"</text>
  </g>

  <g id="ai1" transform="translate(1350 665)">
    <rect class="object-alert" x="0" y="0" width="300" height="170"/>
    <rect class="head-alert" x="0" y="0" width="300" height="42"/>
    <text class="name" x="150" y="27">ai1 : AIAnalysis</text>
    <line class="section-line" x1="0" y1="42" x2="300" y2="42"/>
    <text class="text" x="14" y="70">attackType = "Credential Harvesting"</text>
    <text class="text" x="14" y="92">finding = "Fake login portal"</text>
    <text class="text" x="14" y="114">action = "Do not click"</text>
    <text class="text" x="14" y="136">source = "AI + local evidence"</text>
  </g>

  <!-- Future row -->
  <g id="case1" transform="translate(720 900)">
    <rect class="object-future" x="0" y="0" width="330" height="150"/>
    <rect class="head-alert" x="0" y="0" width="330" height="42"/>
    <text class="name" x="165" y="27">case1 : InvestigationCase</text>
    <line class="section-line" x1="0" y1="42" x2="330" y2="42"/>
    <text class="text" x="14" y="70">severity = "High"</text>
    <text class="text" x="14" y="92">status = "Open"</text>
    <text class="text" x="14" y="114">owner = analyst1</text>
  </g>

  <!-- Legend -->
  <rect class="note" x="90" y="1060" width="960" height="45"/>
  <text class="note-title" x="110" y="1084">Legend:</text>
  <text class="note-text" x="165" y="1084">Object names are underlined as UML object instances. Solid links show runtime object relationships. Dashed links show external enrichment or dependency flow.</text>
</svg>
